name: Capstone checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-test.txt
      - run: python setup_model.py
      - run: python setup_expression.py
      - run: python -m pytest -q --basetemp .test-temp-ci
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - name: Browser fixture checks (no webcam)
        shell: pwsh
        run: |
          python -c "from skimage.data import astronaut; from PIL import Image; Image.fromarray(astronaut()).save('.test-face.png')"
          $env:DMS_TEST_FACE = (Resolve-Path '.test-face.png').Path
          npx playwright test --config web/playwright.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-artifacts
          path: web/test-results
